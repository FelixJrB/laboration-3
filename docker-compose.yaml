services:

  server:
    build:
      context: .
      target: production
    restart: unless-stopped

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    dns:
      - 172.25.8.8
      - 172.25.8.88
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - ./certs/LNU_FTK_Campus_Root_CA_2025.crt:/etc/ssl/certs/LNU_FTK_Campus_Root_CA_2025.crt:ro
    depends_on:
      - server
    restart: unless-stopped

volumes:
  caddy_data:
